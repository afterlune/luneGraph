name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test and check persistence coverage
        run: |
          module="$(go list -m)"
          if output="$(go test -cover ./... 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            exit "$status"
          fi

          for package in checkpoint checkpoint/memory checkpoint/sqlite; do
            coverage=""
            while read -r status name duration label percentage remainder; do
              if [[ "$name" == "$module/$package" && "$label" == "coverage:" ]]; then
                coverage="${percentage%%%}"
                break
              fi
            done <<< "$output"

            if [[ -z "$coverage" || ! "$coverage" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              printf 'coverage for %s is missing or invalid; want at least 80%%\n' "$package" >&2
              exit 1
            fi
            whole="${coverage%%.*}"
            if (( whole < 80 )); then
              printf 'coverage for %s is %s%%; want at least 80%%\n' "$package" "$coverage" >&2
              exit 1
            fi
            printf '%s coverage: %s%% (minimum 80%%)\n' "$package" "$coverage"
          done
      - name: Vet
        run: go vet ./...
      - name: Race test
        if: runner.os == 'Linux'
        run: go test -race ./...
